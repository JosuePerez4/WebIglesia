spring.application.name=icc san luis

# Cargar variables desde el archivo .env
spring.config.import=optional:file:.env[.properties]

# Database configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT (sin defaults: el arranque debe fallar si faltan en .env)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Brevo transactional email (the sender must be verified in Brevo)
brevo.api-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
brevo.api-key=${BREVO_API_KEY}
mail.from=${MAIL_FROM}
mail.from-name=${MAIL_FROM_NAME:ICC San Luis}

# Frontend URL for password reset link
frontend.url=${FRONTEND_URL:http://localhost:5173}
